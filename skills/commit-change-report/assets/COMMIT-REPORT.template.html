<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f6f8; --surface:#fff; --alt:#f8fafc; --text:#17202a; --muted:#52606d; --line:#d8dee6; --accent:#0b6e69; --accent-soft:#d9f3ef; --add:#087443; --delete:#b42318; --warn:#a15c00; --code:#101828; --code-text:#f2f4f7; --radius:14px; }
    @media (prefers-color-scheme: dark) { :root { --bg:#101318; --surface:#181c23; --alt:#20252e; --text:#f2f4f7; --muted:#b3bdca; --line:#343b47; --accent:#5ce0d4; --accent-soft:#153b38; --add:#6ce9a6; --delete:#ff8d86; --warn:#fdb022; --code:#0b0d12; --code-text:#f2f4f7; } }
    * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; line-height:1.6; } main { width:min(1180px,calc(100% - 32px)); margin:auto; padding:48px 0 80px; } header,section { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:clamp(20px,4vw,40px); } section { margin-top:24px; } h1,h2,h3 { line-height:1.3; } h1 { margin:8px 0 12px; font-size:clamp(2rem,5vw,3.25rem); } h2 { margin-top:0; } h3 { margin:0 0 8px; font-size:1rem; } p { max-width:82ch; } a { color:var(--accent); } .eyebrow { color:var(--accent); font-weight:750; letter-spacing:.05em; text-transform:uppercase; } .muted { color:var(--muted); } .meta,.badges { display:flex; flex-wrap:wrap; gap:8px; margin-top:20px; } .badge { display:inline-flex; border:1px solid var(--line); border-radius:999px; padding:4px 10px; font-size:.83rem; font-weight:700; } .add { color:var(--add); } .delete { color:var(--delete); } .warning { color:var(--warn); } .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } .impact { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; } .card,details { background:var(--alt); border:1px solid var(--line); border-radius:10px; padding:18px; } .card p:last-child { margin-bottom:0; } .toc { columns:2; padding-left:20px; } .file-list { margin:0; padding-left:20px; } .file-list li + li { margin-top:10px; } .commit { scroll-margin-top:20px; } .commit + .commit { margin-top:28px; padding-top:28px; border-top:1px solid var(--line); } .commit-meta { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:16px 0; } .key { color:var(--muted); font-size:.86rem; } .flow { display:flex; flex-wrap:wrap; align-items:center; gap:8px; } .step { border:1px solid var(--line); border-radius:8px; padding:8px 10px; background:var(--surface); } .arrow { color:var(--muted); font-weight:700; } pre { overflow-x:auto; margin:12px 0 0; padding:16px; border-radius:9px; background:var(--code); color:var(--code-text); font-size:.88rem; line-height:1.5; } code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; } details + details { margin-top:12px; } summary { cursor:pointer; font-weight:700; } footer { padding:28px 4px 0; color:var(--muted); font-size:.9rem; } @media (max-width:760px) { main { width:min(100% - 20px,1180px); padding-top:20px; } .grid,.impact,.commit-meta { grid-template-columns:1fr; } .toc { columns:1; } } @media print { :root { color-scheme:light; } body { background:#fff; } main { width:100%; padding:0; } header,section { break-inside:avoid; } details > * { display:block; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Git commit change report · {{GENERATED_AT}}</div>
      <h1>{{DOCUMENT_TITLE}}</h1>
      <p>{{EXECUTIVE_SUMMARY}}</p>
      <div class="meta">{{SUMMARY_BADGES}}</div>
    </header>

    <section aria-labelledby="toc-title">
      <h2 id="toc-title">커밋 목차</h2>
      <ol class="toc">{{COMMIT_TOC_ITEMS}}</ol>
    </section>

    <section aria-labelledby="commits-title">
      <h2 id="commits-title">커밋별 변경사항</h2>
      {{COMMIT_SECTIONS}}
    </section>

    <section aria-labelledby="method-title">
      <h2 id="method-title">분석 기준과 제한사항</h2>
      {{GLOBAL_LIMITATIONS}}
    </section>

    <footer>
      <p>생성 시각: {{GENERATED_AT}} · 보고서: COMMIT-REPORT.html</p>
    </footer>
  </main>
</body>
</html>
